# 只把公开接口放出去，管理接口留在本机。
# 装了这份就不用把 8899 直接开在公网上。

upstream aprsnetcn {
    server 127.0.0.1:8899;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /api/v1/ {
        proxy_pass http://aprsnetcn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /docs {
        return 302 /api/v1/openapi.json;
    }

    location / {
        return 404;
    }
}
